<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BAC Admin</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f0f4fb;min-height:100vh;display:flex;align-items:center;justify-content:center}

.login-wrap{width:100%;max-width:420px;padding:20px}

.login-card{
  background:#fff;border-radius:16px;
  box-shadow:0 8px 32px rgba(0,42,105,.13);
  overflow:hidden;
}

.login-header{
  background:linear-gradient(135deg,#002d72,#0656d9);
  padding:32px 36px 28px;
  text-align:center;
}

.login-header img{
  width:200px;height:auto;margin-bottom:16px;display:block;margin-left:auto;margin-right:auto;
}

.login-header h2{
  font-size:14px;font-weight:600;color:rgba(255,255,255,.8);
  letter-spacing:.3px;
}

.login-body{padding:32px 36px 36px}

.field{margin-bottom:18px}

.field label{
  display:block;font-size:12px;font-weight:700;
  color:#1a2d60;margin-bottom:6px;letter-spacing:.2px;
}

.field input{
  width:100%;height:42px;
  border:1.5px solid #d4e2f5;border-radius:8px;
  padding:0 14px;font-size:13px;color:#0f1f4e;
  outline:none;transition:border .2s,box-shadow .2s;
  background:#fafcff;
}

.field input:focus{
  border-color:#0656d9;
  box-shadow:0 0 0 3px rgba(6,86,217,.1);
}

.field .input-wrap{position:relative}

.toggle-pw{
  position:absolute;right:12px;top:50%;transform:translateY(-50%);
  background:none;border:none;cursor:pointer;color:#7a8aaa;font-size:13px;padding:4px;
}

.btn-login{
  width:100%;height:44px;border:none;border-radius:8px;
  background:linear-gradient(90deg,#0040b0,#0656d9);
  color:#fff;font-size:14px;font-weight:700;cursor:pointer;
  margin-top:4px;
  transition:opacity .2s,transform .1s;
  letter-spacing:.3px;
}

.btn-login:hover{opacity:.9}
.btn-login:active{transform:scale(.99)}

.login-footer{
  text-align:center;margin-top:20px;
  font-size:11px;color:#7a8aaa;
}

.login-footer a{color:#0656d9;text-decoration:none;font-weight:600}
.login-footer a:hover{text-decoration:underline}

.back-link{
  display:flex;align-items:center;justify-content:center;gap:6px;
  margin-top:20px;font-size:12px;color:#5d6a86;text-decoration:none;
  transition:color .15s;
}
.back-link:hover{color:#0656d9}

.alert{
  display:none;align-items:center;gap:8px;
  background:#fff3f0;border:1px solid #ffc5bb;border-radius:8px;
  padding:10px 13px;font-size:12px;color:#c0392b;
  margin-bottom:16px;
}
.alert.show{display:flex}
</style>
</head>
<body>

<div class="login-wrap">
  <div class="login-card">

    <div class="login-header">
      <img src="../assets/images/logo 1.png" alt="BAC" onerror="this.style.display='none'">
      <h2>Cổng quản trị nội dung</h2>
    </div>

    <div class="login-body">
      <div class="alert" id="alert">
        <span>&#9888;</span> Tên đăng nhập hoặc mật khẩu không đúng.
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="field">
          <label for="username">Tên đăng nhập</label>
          <input type="text" id="username" placeholder="Nhập tên đăng nhập" autocomplete="username" />
        </div>

        <div class="field">
          <label for="password">Mật khẩu</label>
          <div class="input-wrap">
            <input type="password" id="password" placeholder="Nhập mật khẩu" autocomplete="current-password" />
            <button type="button" class="toggle-pw" onclick="togglePw()" title="Hiện/ẩn mật khẩu">👁</button>
          </div>
        </div>

        <button type="submit" class="btn-login">Đăng nhập</button>
      </form>

      <div class="login-footer">
        Quên mật khẩu? <a href="mailto:hotro@bac.gov.vn">Liên hệ quản trị viên</a>
      </div>
    </div>

  </div>

  <a class="back-link" href="../index.html">
    &#8592; Quay về trang chủ
  </a>
</div>

<script>
function togglePw() {
  var pw = document.getElementById('password');
  pw.type = pw.type === 'password' ? 'text' : 'password';
}

function handleLogin(e) {
  e.preventDefault();
  var alert = document.getElementById('alert');
  alert.classList.remove('show');
  setTimeout(function() { alert.classList.add('show'); }, 200);
}
</script>

</body>
</html>
